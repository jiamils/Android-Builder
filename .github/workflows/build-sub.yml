name: Generate SingBox Config
on:
  workflow_dispatch: # 支持手动点击运行
  schedule:
    - cron: '0 */8 * * *' # 每8小时自动更新（UTC时间）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install SubBridge
        run: npm install -g @0xsnx/subbridge

      - name: Run SubBridge Convert
        env:
          SUB_LINK: ${{ secrets.SUB_URL }}
        run: |
          subbridge build \
            -i "${SUB_LINK}" \
            -t ./template.json \
            -o ./docs/singbox.json

      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
