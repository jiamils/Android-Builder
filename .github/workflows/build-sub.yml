name: Generate SingBox Config
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 直接请求线上订阅，绕过本地source.txt
      - name: SubBridge 转换订阅
        env:
          SUB_LINK: ${{ secrets.SUB_URL }}
        run: |
          npx @0xsnx/subbridge build -i "${SUB_LINK}" -t ./template.json -o ./docs/singbox.json

      - name: 部署Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
