name: Generate SingBox Config
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. 工作流内在线拉订阅，写入临时文件（不会报base64格式错误）
      - name: Download subscribe to temp file
        env:
          SUB_LINK: ${{ secrets.SUB_URL }}
        run: |
          curl -s "${SUB_LINK}" > temp-sub.txt

      # 2. 读取临时文件转换
      - name: Run SubBridge Convert
        run: |
          npx @0xsnx/subbridge build \
            -i ./temp-sub.txt \
            -t ./template.json \
            -o ./docs/singbox.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
