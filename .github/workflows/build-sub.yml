name: Generate SingBox Config
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run SubBridge Convert
        env:
          SUB_LINK: ${{ secrets.SUB_URL }}
        run: |
          ls -la
          npx @0xsnx/subbridge build \
            -i "${SUB_LINK}" \
            -t ./template.json \
            -o ./docs/singbox.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
